<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="14" y="12" width="192" height="192" rx="44" fill="#ffffff"/>
    <rect x="22" y="20" width="176" height="176" rx="38" fill="url(#bg)"/>
    <circle cx="52" cy="46" r="14" fill="#ffffff" opacity="0.18"/>
    <circle cx="174" cy="54" r="9" fill="#ffffff" opacity="0.22"/>
    
    <g transform="translate(110, 96)">
      <!-- Ears -->
      <polygon points="-44,-22 -48,-60 -14,-44" fill="#fde68a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="44,-22 48,-60 14,-44" fill="#fde68a" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="-38,-28 -41,-50 -20,-40" fill="#fda4af"/>
      <polygon points="38,-28 41,-50 20,-40" fill="#fda4af"/>
      <!-- Chubby Head -->
      <ellipse cx="0" cy="0" rx="52" ry="44" fill="#fde68a" stroke="#ffffff" stroke-width="5"/>
      <!-- Forehead stripes -->
      <path d="M-8,-42 L-8,-30 M0,-44 L0,-28 M8,-42 L8,-30" stroke="#92400e" stroke-width="3.5" stroke-linecap="round" opacity="0.28"/>
      <!-- Rosy Cheeks -->
      <ellipse cx="-30" cy="10" rx="9" ry="5.5" fill="#fb7185" opacity="0.48"/>
      <ellipse cx="30" cy="10" rx="9" ry="5.5" fill="#fb7185" opacity="0.48"/>
      <!-- Whiskers -->
      <line x1="-42" y1="2" x2="-58" y2="-2" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-42" y1="10" x2="-58" y2="12" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="42" y1="2" x2="58" y2="-2" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="42" y1="10" x2="58" y2="12" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Nose -->
      <polygon points="-4,4 4,4 0,9" fill="#fb7185"/>
      
        <circle cx="-18" cy="-4" r="6" fill="#0f172a"/>
        <circle cx="18" cy="-4" r="6" fill="#0f172a"/>
        <circle cx="-16" cy="-6" r="2.2" fill="#ffffff"/>
        <circle cx="20" cy="-6" r="2.2" fill="#ffffff"/>
        <path d="M-12 13 Q0 24 12 13" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
      
      
        <polygon points="-24,-42 -16,-62 0,-48 16,-62 24,-42" fill="#facc15" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/>
      
    </g>
  
    <g transform="translate(110, 174)">
      <rect x="-86" y="-22" width="172" height="40" rx="20" fill="#ffffff"/>
      <rect x="-82" y="-18" width="164" height="32" rx="16" fill="#047857"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Segoe UI', 'Roboto', 'Noto Sans', Arial, sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="0.3">10 ĐIỂM!</text>
    </g>
  </g>
</svg>
