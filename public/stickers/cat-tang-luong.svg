        <polygon points="-18,-14 -15,-6 -7,-5 -13,0 -11,8 -18,4 -25,8 -23,0 -29,-5 -21,-6" fill="#eab308"/>
        <polygon points="18,-14 21,-6 29,-5 23,0 25,8 18,4 11,8 13,0 7,-5 15,-6" fill="#eab308"/>
        <path d="M-10 13 Q0 24 10 13" fill="#f43f5e" stroke="#0f172a" stroke-width="3"/>
      
      
        <circle cx="-54" cy="-36" r="13" fill="#facc15" stroke="#a16207" stroke-width="2.5"/>
        <text x="-54" y="-31" text-anchor="middle" font-family="Arial" font-weight="900" font-size="14" fill="#854d0e">$</text>
        <circle cx="56" cy="-32" r="13" fill="#facc15" stroke="#a16207" stroke-width="2.5"/>
        <text x="56" y="-27" text-anchor="middle" font-family="Arial" font-weight="900" font-size="14" fill="#854d0e">$</text>
      
    </g>
  
    <g transform="translate(110, 174)">
