        <path d="M-46 -26 C-46 -26, -58 -34, -58 -41 C-58 -45, -55 -48, -51 -48 C-49 -48, -47 -46, -46 -44 C-45 -46, -43 -48, -41 -48 C-37 -48, -34 -45, -34 -41 C-34 -34, -46 -26, -46 -26 Z" fill="#fb7185"/>
      
